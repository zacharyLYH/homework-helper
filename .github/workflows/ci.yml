name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-debug/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Install frontend-debug dependencies
        working-directory: frontend-debug
        run: npm ci

      - name: TypeScript check (frontend-debug)
        working-directory: frontend-debug
        run: npx tsc --noEmit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Pyright (backend)
        working-directory: backend
        run: npx pyright app/

  build-frontend:
    name: Build Frontends
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-debug/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install & build frontend-debug
        working-directory: frontend-debug
        run: npm ci && npm run build

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v

  test-frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run behavioral E2E tests
        working-directory: frontend
        run: npm run playwright:behavioral

      - name: Run performance E2E tests
        working-directory: frontend
        run: npm run playwright:performance

      - name: Run visual E2E tests
        working-directory: frontend
        run: npm run playwright:visual

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build
